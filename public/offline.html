<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>DineManager Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      p {
        margin: 0 0 20px;
        color: #475569;
        line-height: 1.6;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #0f766e;
        color: white;
        font-weight: 700;
        padding: 12px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192x192.png" alt="DineManager" />
      <h1>ยังไม่ได้เชื่อมต่ออินเทอร์เน็ต</h1>
      <p>ลองเชื่อมต่ออีกครั้งเพื่อกลับไปจัดการร้านและรายการสั่งอาหารล่าสุด</p>
      <button onclick="window.location.reload()">ลองใหม่</button>
    </main>
  </body>
</html>
